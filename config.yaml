# =====================================================================
#  Sinek Evrimi — Faz 3 varsayilan konfigurasyonu
#  (akrabalik + paylasma; surekli/steady-state evrim)
#  Onceki fazlar: python run.py --config experiments/faz1_klonlar.yaml
#                 python run.py --config experiments/faz2_evrim.yaml
#  Bu dosya "tek dogru kaynak"tir. Kendi deneyin icin kopyalayip
#  degistirin:  python run.py --config deneylerim/kitlik.yaml
#  Kismi dosya da verebilirsiniz: eksik anahtarlar buradan doldurulur.
# =====================================================================

# Ayni seed + ayni config => byte-byte ayni sonuc.
seed: 42

run:
  name: faz3            # runs/<name>/ altina cikti yazilir
  steps: 12000          # toplam simulasyon adimi
  log_every: 2000       # terminale ozet basma sikligi (adim)
  stop_if_extinct: true # populasyon 0'a duserse erken bitir

world:
  # FAZ 3 daha genis bir dunya kullanir (Faz 1/2: 160x100).
  # Gerekce: tek, iyi karisan bir populasyonda soylar art arda gelen
  # boom-bust darbogazlarinda hizla tukeniyor (6000 adimda 200 -> 3 etkin soy).
  # Daha genis ve daha cok yamali bir dunya, soylara yerel siginak birakiyor
  # (ayni adimda 13 etkin soy) — hem olcum gucu icin hem de akrabalarin
  # uzamsal kumelenmesi zaten incelenen mekanizma oldugu icin gerekli.
  width: 240            # izgara hucresi sayisi (x)
  height: 150           # izgara hucresi sayisi (y)
  toroidal: true        # kenarlar sarmali mi (donut dunya)

  food:
    # Kapasite alani: gaussian "yamalar" toplamiyla uretilir.
    # Yamali dunya => sineklerin kaynak etrafinda kumelenmesi mumkun olur.
    patches: 24           # yama sayisi
    patch_radius: 11.0    # yama yaricapi (hucre)
    patch_peak: 1.0       # yama merkezindeki kapasite
    background: 0.05      # yama disi taban kapasite
    initial_fill: 0.60    # baslangicta kapasitenin ne kadari dolu
    regrowth_mode: logistic   # logistic | constant
    regrowth_rate: 0.010      # adim basina yenilenme hizi
    seed_rate: 0.0006         # bos hucrelerin "tohumlanma" hizi (logistic)
    energy_per_unit: 22.0     # 1 birim yemek = kac enerji

  hazard:
    count: 5              # sabit tehlike diski sayisi
    radius: 6.0
    damage: 3.5           # icindeyken adim basina enerji kaybi
    avoid_food_patches: true  # tehlikeleri yama merkezlerinden uzaga koy

  climate:
    # Faz 1'de sadece kaydedilir/cizilir; davranisa etkisi yok.
    # Faz 2+ icin sensor olarak baglanabilir.
    temperature_gradient: vertical   # none | vertical | horizontal
    light_gradient: none

agents:
  initial_count: 300      # ayni zamanda KURUCU SOY sayisi (her birine benzersiz soyisim)
  max_count: 700         # populasyon tavani (bellek/hiz emniyeti)
  spawn: scatter          # scatter | center

  energy:
    initial: 65.0
    max: 160.0
    metabolism: 0.60      # adim basina sabit yasam maliyeti
    move_cost: 1.00       # hiz^2 basina hareket maliyeti
    eat_rate: 0.35        # adim basina agiza sigan max yemek birimi

  lifespan: 900           # ortalama azami yas (adim)
  lifespan_jitter: 120    # dogumda +/- rastgele sapma

  senses:
    food_radius: 9.0      # yemek gradyani tarama yaricapi (hucre)
    hazard_radius: 12.0
    neighbor_radius: 8.0

  motors:
    max_speed: 0.85       # hucre / adim
    max_turn: 0.45        # radyan / adim

  reproduction:
    enabled: true
    energy_threshold: 130.0  # bu enerjinin uzerinde bolunur
    min_age: 50
    cost: 15.0               # bolunme sabit maliyeti
    child_share: 0.45        # cocuga aktarilan enerji orani
    spawn_radius: 1.5

brain:
  type: rnn               # kayitli backend: reflex | rnn  (bkz. sinek/brains/)
  hidden: 12              # rnn: gizli noron sayisi (genom boyutunu belirler)
  rnn_leak: 0.5           # rnn: 0 = tam bellek, 1 = belleksiz (sizintili integrator)
  noise: 0.15             # rnn: donus gurultusu olcegi (genomdaki 'wander' ile carpilir)
  init_sigma: 0.60        # rnn: baslangic agirlik dagiliminin std sapmasi
  turn_gain: 1.6          # reflex: ham istegin donuse cevrim kazanci

genome:
  # Kurucu genom. rnn beyninde bu parametrelerden yalnizca 'wander'
  # kullanilir (kesif gurultusu olcegi); geri kalani reflex beynin devresidir.
  # evolution.founder_spread ile bu degerlerin etrafinda cesitlilik uretilir.
  params:
    food_attraction: 1.00   # yemek gradyanina cekim
    hazard_avoidance: 1.60  # tehlikeden kacinma
    crowd_bias: 0.00        # + : komsuya cekim (surulesme), - : itme
    wander: 0.30            # rastgele yon gurultusu
    speed_pref: 0.70        # tercih edilen hiz (0..1)
    eat_threshold: 0.02     # bu miktarin altinda yemek yemez
    hunger_gain: 1.20       # aclik yemek arayisini ne kadar guclendirir
    graze_slowdown: 0.75    # yemek uzerinde yavaslama (alan-kisitli arama)
    panic_speed: 0.60       # tehlike yakininda hizlanma
    hunger_speed: 0.25      # aclikta hizlanma
    share_urge: 0.00        # refleks beynin kosulsuz paylasim egilimi (Faz 3)

evolution:
  enabled: true           # FAZ 2: mutasyon ACIK. false -> klonlar (Faz 1 kontrolu)

  # --- secilim modu ---
  # steady_state : Faz 1 ekolojisi; ureme surekli, secilim ortuk (kim cok
  #                yerse cok bolunur). Boom-bust salinimi korunur.
  # generational : Klasik GA; sabit uzunlukta nesiller, nesil sonunda toplu
  #                secilim. "Ortalama basari nesiller boyunca artiyor mu"
  #                sorusunun en temiz olculdugu mod.
  # FAZ 3 steady_state kullanir: akrabalik secilimi ekolojiye muhtactir.
  # Nesil sinirinda dunyayi sifirlayip herkesi rastgele dagitmak, akrabalarin
  # uzamsal kumelenmesini — yani mekanizmanin kendisini — yok eder.
  mode: steady_state
  generation_length: 250  # generational: bir neslin adim sayisi
  epoch_length: 500       # steady_state: periyodik evrim raporu araligi
  reset_world: true       # generational: her nesilde yemek stogu sifirlansin mi
  elite_count: 3          # en iyi N genom mutasyonsuz gecer
  tournament_size: 3      # turnuva secilimi aday sayisi (buyuk = sert secilim)

  # --- neyin "basari" sayildigi ---
  # Bunlari degistirmek evrimin YONUNU degistirir. Deneyin asil dugmesi bu.
  fitness:
    age: 1.0              # hayatta kalinan adim
    children: 4.0         # birakilan yavru (generational modda hep 0)
    food_eaten: 8.0       # toplanan yemek birimi
    energy: 0.5           # olcum anindaki enerji
    distance: 0.0         # katedilen mesafe (ornek: gezginligi odullendir)

  # --- baslangic cesitliligi ---
  # 0.0 -> herkes kurucu genomun klonu (Faz 1)
  # 1.0 -> parametreler dagilir, sinir aglari tamamen bagimsiz rastgele
  founder_spread: 1.0
  founder_param_sigma: 0.25

  # --- mutasyon ---
  mutation_rate: 0.25       # isimli parametre basina mutasyon olasiligi
  mutation_sigma: 0.08      # parametre mutasyonu std sapmasi
  weight_mutation_rate: 0.10   # agirlik basina olasilik (agirliklar cok kalabalik)
  weight_mutation_sigma: 0.20  # agirlik mutasyonu std sapmasi
  weight_clip: 4.0             # agirliklarin mutlak siniri

  param_bounds:           # parametre mutasyonu sonrasi kirpma araliklari
    food_attraction: [0.0, 3.0]
    hazard_avoidance: [0.0, 3.0]
    crowd_bias: [-2.0, 2.0]
    wander: [0.0, 1.5]
    speed_pref: [0.0, 1.0]
    eat_threshold: [0.0, 0.5]
    hunger_gain: [0.0, 3.0]
    graze_slowdown: [0.0, 1.0]
    panic_speed: [0.0, 2.0]
    hunger_speed: [0.0, 1.5]
    share_urge: [0.0, 1.0]

rules:
  # =================================================================
  #  FAZ 3 — akrabalik ve isbirligi
  #
  #  UC KURAL (ihlali deneyi gecersiz kilar):
  #   1. Rol/kast KODLANMAZ. Kosullar kurulur, is bolumu cikarsa cikar.
  #   2. PAYLASIM ODULLENDIRILMEZ. evolution.fitness icinde paylasim terimi
  #      YOKTUR. Verenin net maliyeti vardir; kâr yalnizca DOLAYLI olabilir
  #      (akrabaya yardim = ortak genin hayatta kalmasi).
  #   3. Isbirligi in-group / out-group diye AYRI olculur; ittifak kural
  #      olarak atanmaz, sadece oranlar raporlanir.
  # =================================================================
  share:
    enabled: true
    threshold: 0.55       # motor bu esigi asarsa paylasir
    amount: 8.0           # motor=1 iken aktarilan azami enerji
    overhead: 1.2         # verenin EKSTRA kaybi -> net maliyet sarti
    min_donor_energy: 10.0  # verenin altina inemeyecegi taban
    # AZALAN VERIM (Faz 3 adim 1.5'te olculdu, bkz. docs/faz3/):
    # Ham enerji aktariminda veren amount+overhead kaybeder, alici en fazla
    # amount kazanir -> b/c <= 1 YAPISALDIR. r <= 1 oldugu icin Hamilton
    # kurali r*b > c bu haliyle ASLA saglanamaz.
    # Bu katsayi ayni kalorinin AC bir aliciya daha degerli olmasini modeller
    # (alicinin donusum verimi). Verene hicbir sey kazandirmaz, odul degildir.
    #   0.0 = dogrusal (adim 1 davranisi)
    #   3.0 = olmek uzere olan alici 4 kat verim alir
    need_bonus: 0.0

  attack:
    enabled: false        # FAZ 3 ADIM 2 (acilirsa NotImplementedError)
    damage: 8.0
    steal_ratio: 0.5
    penalty: 0.0

  kinship:
    radius: 2.5           # hem akrabalik sensoru hem paylasim menzili
    # KONTROL GRUPLARI — akrabalik yapisini bozarlar:
    #   none                    : normal kosum
    #   random_surname_at_birth : etiket birey icin sabit ama KALITSAL DEGIL
    #                             -> soyisim gercek akrabalik bildirmez (asil kontrol)
    #   shuffle_surnames        : her adim yasayanlar arasinda karistir
    #   scatter_offspring       : yavru haritaya rastgele dogar (uzamsal yapi bozulur)
    control: none
    # Soy bolunmesi: yavrunun soyismi bu olasilikla YENI olur.
    # Soylar yalnizca tukenebildigi icin (yeni kurucu yok) etiket cesitliligi
    # bu olmadan sifira gider; herkes akraba olunca in/out ayrimi anlamsizlasir.
    # Yuksek deger etiketin akrabalik BILGISINI bozar -> dusuk tutulmali.
    # Kontrol gruplarina da birebir ayni oranda uygulanir.
    split_rate: 0.010

metrics:
  enabled: true
  every: 1                # kac adimda bir satir yazilsin
  csv: metrics.csv

viz:
  mode: frames            # none | frames | pygame
  color_by: lineage       # energy | lineage — Faz 3'te soyisme gore renk
  show_share: true        # paylasim olaylarini yesil cizgiyle goster
  scale: 4                # 1 dunya hucresi = kac piksel
  every: 100              # kac adimda bir kare
  frames_dir: frames
  max_frames: 400
  fps: 45                 # sadece pygame
  show_hazards: true
  hud: true
