# FAZ 3 adım 1.5 — azalan verim rejimi.
#
# Adım 1'de kin altruizmi çıkmadı. Sebebi ölçüldü: ham enerji aktariminda
# veren amount+overhead kaybeder, alici en fazla amount kazanir, yani
# b/c <= 1 YAPISALDIR. r <= 1 oldugu icin Hamilton kurali r*b > c
# matematiksel olarak saglanamiyordu (olculen en yuksek r*b/c = 0.52).
#
# Bu rejim tek yapisal engeli kaldirir: rules.share.need_bonus, ayni kalorinin
# AC bir aliciya daha degerli olmasini modeller (alicinin donusum verimi).
# Verene hicbir sey kazandirmaz; "paylasim odullendirilmez" kurali korunur.
# Ayrica akrabalar mekansal olarak baglanir (r kolunu buyutur).
#   python run.py --config experiments/faz3_azalan_verim.yaml
run:
  name: faz3_azalan
  steps: 6000
agents:
  motors:
    max_speed: 0.20
    max_turn: 0.25
  reproduction:
    spawn_radius: 0.3
rules:
  attack:
    enabled: false        # bu deney saldirisiz kurulmustu
  share:
    need_bonus: 3.0
