# FAZ 3 TABAN CIZGISI: paylasim mekanigi tamamen kapali.
# Ayni ekolojide "hic paylasim olmasaydi" referansi — populasyon, enerji ve
# soy cesitliligi karsilastirmasi icin.
#   python run.py --config experiments/faz3_paylasimsiz.yaml
run:
  name: faz3_paylasimsiz
rules:
  partner:
    enabled: false        # Faz 6 mekanigi; bu deney secimsiz kuruldu
  memory:
    enabled: false        # Faz 5 mekanigi; bu deney hafizasiz kuruldu
  attack:
    enabled: false        # bu deney saldirisiz kurulmustu
  predator:
    enabled: false        # Faz 4 mekanigi; bu deney avcisiz kurulmustu
  share:
    enabled: false
