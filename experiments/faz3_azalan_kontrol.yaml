# faz3_azalan_verim.yaml ile AYNI rejim + soyisim karistirma kontrolu.
# Etiket bilgisizken kin_bias duz kalmali; kalmiyorsa bulgu yapaylik demektir.
#   python run.py --config experiments/faz3_azalan_kontrol.yaml
run:
  name: faz3_azalan_kontrol
  steps: 6000
agents:
  motors:
    max_speed: 0.20
    max_turn: 0.25
  reproduction:
    spawn_radius: 0.3
rules:
  memory:
    enabled: false        # Faz 5 mekanigi; bu deney hafizasiz kuruldu
  predator:
    enabled: false        # Faz 4 mekanigi; bu deney avcisiz kurulmustu
  attack:
    enabled: false        # bu deney saldirisiz kurulmustu
  share:
    need_bonus: 3.0
    # Bu deney need_bonus'un ENERJI olarak uygulandigi surumde kosuldu:
    # paylasim koloniye net enerji EKLIYORDU (bkz. docs/faz45/). Varsayilan
    # artik korunumlu; eski sonuclari yeniden uretebilmek icin acikca pinlenir.
    need_mode: energy
  kinship:
    control: shuffle_surnames
