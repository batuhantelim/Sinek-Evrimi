# FAZ 2 KONTROL: secilim baskisi YOK, sadece suruklenme (genetic drift).
# Tum fitness agirliklari 0 -> turnuva rastgele ebeveyn secer.
#   python run.py --config experiments/faz2_kontrol_secilimsiz.yaml
run:
  name: faz2_kontrol_secilimsiz
  steps: 8000
  log_every: 250
agents:
  initial_count: 120
  max_count: 1200
evolution:
  mode: generational
  generation_length: 250
  elite_count: 0          # elitizm de kapali; yoksa gizli bir secilim kalir
  fitness:
    age: 0.0
    children: 0.0
    food_eaten: 0.0
    energy: 0.0
    distance: 0.0
rules:
  predator:
    enabled: false        # Faz 4 mekanigi; bu deney avcisiz kurulmustu
  attack:
    enabled: false        # bu deney saldirisiz kurulmustu
  share:
    enabled: false
viz:
  color_by: energy
  every: 50
