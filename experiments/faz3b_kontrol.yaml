# FAZ 3 adım 2 KONTROL: ayni rejim + soyisim karistirma.
#
# Rejim: adim 1.5'te paylasimin nefes aldigi r_azalan + need_bonus.
# Baska bir rejimde kurulursa saldiri da ayni b/c <= 1 muhasebe tavanina
# carpar ve yorumlanamaz negatif verir.
#
# Asil soru: in-grup fedakarlik ile dis-grup dusmanlik BIRLIKTE mi
# evrimlesiyor? (parochial altruism)
# Etiket bilgisizken hem paylasim hem saldiri egrileri DUZ kalmali.
#   python run.py --config experiments/faz3b_kontrol.yaml --load-genomes docs/faz2/population.npz
run:
  name: faz3b_kontrol
  steps: 12000
agents:
  motors:
    max_speed: 0.20
    max_turn: 0.25
  reproduction:
    spawn_radius: 0.3
rules:
  memory:
    enabled: false        # Faz 5 mekanigi; bu deney hafizasiz kuruldu
  predator:
    enabled: false        # Faz 4 mekanigi; bu deney avcisiz kurulmustu
  share:
    need_bonus: 3.0
    # Bu deney need_bonus'un ENERJI olarak uygulandigi surumde kosuldu:
    # paylasim koloniye net enerji EKLIYORDU (bkz. docs/faz45/). Varsayilan
    # artik korunumlu; eski sonuclari yeniden uretebilmek icin acikca pinlenir.
    need_mode: energy
  attack:
    enabled: true
  kinship:
    control: shuffle_surnames
