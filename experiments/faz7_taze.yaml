# FAZ 7 — TAZE ZEMİN: her deney kendi 0. neslinden başlar.
#
# Rejim Faz 4.5'in temiz ekolojisiyle BİREBİR aynı (korunumlu paylaşım,
# bağlayıcı olmayan tavan, r_azalan + need_bonus + attack). İki fark:
#
# 1. TOHUM YOK. `run.load_genomes` boş — rastgele bir 0. nesil, her kurucuya
#    benzersiz soyisim. Faz 1-6'da her faz bir öncekinin kazananlarını
#    tohumluyordu ve bu bir CLI bayrağıydı, yani zincirleme fiilen varsayılandı.
# 2. `evolution.immigration_rate` — doğumların bu oranında yavru TAZE bir
#    kurucu genomla doğar ve yeni bir soy açar. Gerekçe ölçüldü: taze
#    başlangıç TEK BAŞINA çeşitliliği KORUMUYOR, tam tersine hızlı bir
#    seçilim süpürgesi yaşatıyor (ilk 500 adımda en büyük soy %32'ye, 12000'de
#    %99'a çıkıyor). Oran, ölçütü geçen EN KÜÇÜK değerde sabitlendi
#    (bkz. docs/faz7/).
#
#   python run.py --config experiments/faz7_taze.yaml --seed 42
run:
  name: faz7_taze
  steps: 12000
  load_genomes: null      # TAZE — açıkça yazılır, varsayılana güvenilmez
agents:
  max_count: 5000
  motors:
    max_speed: 0.20
    max_turn: 0.25
  reproduction:
    spawn_radius: 0.3
evolution:
  immigration_rate: 0.01
rules:
  partner:
    enabled: false
  memory:
    enabled: false
  predator:
    enabled: false
  share:
    need_bonus: 3.0
    need_mode: fitness
  attack:
    enabled: true
viz:
  color_by: lineage
  every: 50
