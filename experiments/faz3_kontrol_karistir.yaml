# FAZ 3 KONTROL (alternatif): soyisimler her adim yasayanlar arasinda karistirilir.
# Akrabalik sensoru saf gurultuye doner. En sert kontrol.
#   python run.py --config experiments/faz3_kontrol_karistir.yaml
run:
  name: faz3_kontrol_karistir
rules:
  partner:
    enabled: false        # Faz 6 mekanigi; bu deney secimsiz kuruldu
  memory:
    enabled: false        # Faz 5 mekanigi; bu deney hafizasiz kuruldu
  attack:
    enabled: false        # bu deney saldirisiz kurulmustu
  predator:
    enabled: false        # Faz 4 mekanigi; bu deney avcisiz kurulmustu
  kinship:
    control: shuffle_surnames
