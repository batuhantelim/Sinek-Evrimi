# FAZ 4 adım 1 AVCISIZ KONTROL — avcı KAPALI + soyisim karıştırma.
#
# 2x2 tasarımın dördüncü hücresi: {avcı var/yok} x {gerçek etiket/karıştırma}.
# Avcılı kolun ayrımcılığı kendi kontrolüne, avcısız kolunki kendi kontrolüne
# karşı okunur; iki t değeri ancak ondan sonra kıyaslanır.
#   python run.py --config experiments/faz4_avcisiz_kontrol.yaml --load-genomes docs/faz2/population.npz
run:
  name: faz4_avcisiz_kontrol
  steps: 12000
agents:
  motors:
    max_speed: 0.20
    max_turn: 0.25
  reproduction:
    spawn_radius: 0.3
rules:
  memory:
    enabled: false        # Faz 5 mekanigi; bu deney hafizasiz kuruldu
  predator:
    enabled: false
  share:
    need_bonus: 3.0
    # Bu deney need_bonus'un ENERJI olarak uygulandigi surumde kosuldu:
    # paylasim koloniye net enerji EKLIYORDU (bkz. docs/faz45/). Varsayilan
    # artik korunumlu; eski sonuclari yeniden uretebilmek icin acikca pinlenir.
    need_mode: energy
  attack:
    enabled: true
  kinship:
    # Etiket tanımı gereği bilgisiz: gerçek kolda in/out farkı çıkıyorsa
    # burada DÜZ kalmalı. Kalmıyorsa sinyal yapaydır.
    control: shuffle_surnames
viz:
  color_by: lineage
  every: 50
